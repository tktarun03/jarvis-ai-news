<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <radialGradient id="edge" cx="50%" cy="50%" r="50%"><stop offset=".8" stop-color="#fff"/><stop offset=".92" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="feather"><circle cx="32" cy="32" r="27" fill="url(#edge)"/></mask>
    <radialGradient id="mag" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F04DF6"/><stop offset=".45" stop-color="#F04DF6" stop-opacity=".85"/><stop offset="1" stop-color="#F04DF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3FE0F6"/><stop offset=".45" stop-color="#3FE0F6" stop-opacity=".85"/><stop offset="1" stop-color="#3FE0F6" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6A84F8"/><stop offset="1" stop-color="#6A84F8" stop-opacity="0"/></radialGradient>
    <radialGradient id="light" cx="45%" cy="10%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="#C8A5FF" stop-opacity=".45"/><stop offset="1" stop-color="#C8A5FF" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#glow)" filter="url(#halo)"/>
  <g mask="url(#feather)">
    <circle cx="32" cy="32" r="27" fill="#F1EAFF"/>
    <g filter="url(#soft)">
      <ellipse cx="22" cy="40" rx="15" ry="13" fill="url(#mag)"/>
      <ellipse cx="42" cy="44" rx="14" ry="12" fill="url(#cyan)"/>
      <ellipse cx="49" cy="28" rx="11" ry="13" fill="url(#blue)"/>
    </g>
    <rect x="0" y="0" width="64" height="64" fill="url(#light)"/>
  </g>
</svg>

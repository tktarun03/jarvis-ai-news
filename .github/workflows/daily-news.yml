name: Daily AI News

on:
  schedule:
    # GitHub cron is UTC. Edit scripts/config.json and run scripts/set-schedule.py to change it.
    - cron: "30 4 * * *"  # jarvis-schedule: 07:30 Asia/Qatar = 04:30 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's edition even if it already exists"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jarvis-daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      published: ${{ steps.generate.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline pipeline tests
        run: python -m unittest discover -s tests -v

      - name: Generate today's edition
        id: generate
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JARVIS_MODEL: ${{ vars.JARVIS_MODEL }}
        run: |
          python scripts/generate-news.py ${{ inputs.force && '--force' || '' }}

      - name: Validate before publishing
        run: python scripts/validate.py

      - name: Commit and push the edition
        if: steps.generate.outputs.published == 'true'
        run: |
          git config user.name "JARVIS AI News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html news data assets/images/covers
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "edition: ${{ steps.generate.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html news data assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

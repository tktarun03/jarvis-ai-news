name: Daily AI News

on:
  schedule:
    # GitHub cron is UTC. Edit scripts/config.json and run scripts/set-schedule.py to change it.
    - cron: "30 4 * * *"  # jarvis-schedule: 07:30 Asia/Qatar = 04:30 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's edition even if it already exists"
        type: boolean
        default: false
      refresh_images_date:
        description: "Only look up publisher images for this existing edition (YYYY-MM-DD); skips generation"
        type: string
        required: false
        default: ""
      deploy_only:
        description: "Only republish the site (no edition build); used by the feedback Worker deploy"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read

concurrency:
  group: jarvis-daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      published: ${{ steps.generate.outputs.published }}
      news_base: ${{ steps.revisions.outputs.base }}
      deployed_sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture comparison revision
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline pipeline tests
        run: python -m unittest discover -s tests -v

      - name: Generate today's edition
        id: generate
        if: github.event_name != 'push' && !inputs.deploy_only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JARVIS_MODEL: ${{ vars.JARVIS_MODEL }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JARVIS_AGENT: github-actions
        run: |
          if [ -n "${{ inputs.refresh_images_date }}" ]; then
            python scripts/generate-news.py --refresh-images "${{ inputs.refresh_images_date }}"
          else
            python scripts/generate-news.py ${{ inputs.force && '--force' || '' }}
          fi

      - name: Validate before publishing
        run: python scripts/validate.py

      - name: Update rating summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/feedback-summary.py

      - name: Commit and push the edition
        if: steps.generate.outputs.published == 'true'
        run: |
          git config user.name "JARVIS AI News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html news data assets/images/covers
          if [ -d assets/images/news ]; then git add assets/images/news; fi
          if [ -d assets/images/stock ]; then git add assets/images/stock; fi
          if [ -d assets/images/ai ]; then git add assets/images/ai; fi
          if [ -d assets/images/share ]; then git add assets/images/share; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "edition: ${{ steps.generate.outputs.date }}${{ inputs.refresh_images_date && ' (publisher images)' || '' }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record deployed source
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html news data assets manifest.webmanifest OneSignalSDKWorker.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4


  notify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.deployed_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify subscribed devices of changed news
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          NEWS_BASE_SHA: ${{ needs.build.outputs.news_base }}
        run: python scripts/notify-news.py

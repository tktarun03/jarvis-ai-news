name: Deploy feedback Worker

# One-time setup (see AGENTS.md → Feedback): add the FEEDBACK_GITHUB_TOKEN secret, then run this.
# It deploys feedback-worker/ to Cloudflare, gives it the GitHub token, points the app at it,
# commits that, and republishes the site.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: jarvis-feedback-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
      WRANGLER: wrangler@4.151.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_DEPLOY_TOKEN(or CLOUDFLARE_API_TOKEN)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$FEEDBACK_GITHUB_TOKEN" ] || missing="$missing FEEDBACK_GITHUB_TOKEN"
          if [ -n "$missing" ]; then echo "::error::Missing Actions secrets:$missing"; exit 1; fi

      - name: Test the Worker
        run: node feedback-worker/test.mjs

      - name: Deploy the Worker
        id: deploy
        working-directory: feedback-worker
        run: |
          npx --yes "$WRANGLER" deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::No workers.dev URL in the deploy output. Does the Cloudflare account have a workers.dev subdomain, and can the token edit Workers Scripts?"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Give the Worker its GitHub token
        working-directory: feedback-worker
        run: printf '%s' "$FEEDBACK_GITHUB_TOKEN" | npx --yes "$WRANGLER" secret put GITHUB_TOKEN

      - name: Point the app at the Worker
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          python scripts/set-feedback-endpoint.py "$URL"
          python scripts/generate-news.py --rerender
          python scripts/validate.py
          git config user.name "JARVIS AI News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/config.json index.html news
          if git diff --cached --quiet; then echo "Endpoint unchanged."; exit 0; fi
          git commit -m "feedback: point the app at $URL"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Republish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-news.yml --ref main -f deploy_only=true
